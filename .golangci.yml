version: "2"

run:
  timeout: 5m
  tests: true

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - cyclop
    - dupl
    - errcheck
    - errname
    - errorlint
    - funlen
    - gocognit
    - godox
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nilnil
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    cyclop:
      # Existing command dispatch and protocol projection peaks at 67. Keep a
      # hard ceiling while refactors move those adapters out of app.
      max-complexity: 70
    dupl:
      threshold: 150
    funlen:
      lines: 250
      statements: 160
    gocognit:
      # Baseline ceiling; new code must not create a worse hotspot.
      min-complexity: 76
    godox:
      keywords:
        - TODO
        - FIXME
        - BUG
        - HACK
    gosec:
      excludes:
        - G201
        - G202
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
    errcheck:
      check-type-assertions: true
      # Explicit blank assignments mark deliberate best-effort cleanup.
      check-blank: false
  exclusions:
    generated: lax
    paths:
      - vendor
      - LICENSES
      - third_party$
    rules:
      - path: _test\.go$
        linters:
          - funlen
          - gocognit
          - dupl
          - errcheck
          - noctx
          - contextcheck
          - gosec
          - errname
          - errorlint
          - bodyclose
          - cyclop
          - nilnil
          - perfsprint
          - prealloc
          - revive
          - staticcheck
          - unconvert
      # These boundaries intentionally create/close context-owning services;
      # contextcheck cannot model their lifecycle contracts.
      - path: ^cmd/gitcontribute/main\.go$|^internal/app/(app|discovery|hydration|jobs)\.go$
        linters:
          - contextcheck
      # Paths, commands, and public token names are validated at their owning
      # boundaries; these gosec heuristics are false positives there.
      - text: "G(101|204|301|302|304):"
        linters:
          - gosec
      # Optional corpus lookups use nil,nil as their established ordinary-miss
      # contract; callers distinguish misses from storage failures.
      - path: ^internal/corpus/
        linters:
          - nilnil
      # Status turns inspection failures into a structured unhealthy result.
      - path: ^internal/app/app\.go$
        linters:
          - nilerr
      # These row sets are deliberately closed before a subsequent statement
      # on the same SQLite transaction or connection.
      - path: ^internal/corpus/(frontier|jobs|tracking)\.go$
        linters:
          - sqlclosecheck
